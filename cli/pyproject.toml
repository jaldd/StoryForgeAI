[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-agent"
version = "0.1.0"
description = "命令行小说创作 Agent（小说解耦，配置驱动）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StoryForgeAI" }]
dependencies = [
    "openai>=1.0",
    "chromadb>=0.5",
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
novel-agent = "novel_agent.cli:main"

[tool.setuptools]
packages = ["novel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 真实调用 LLM/向量库的集成测试（默认 skip）",
]
addopts = "-m 'not integration'"
